services:
  dd-agent:
    image: registry.datadoghq.com/agent:${DD_AGENT_VERSION:-latest}
    env_file: .env
    environment:
      - DD_API_KEY
      - DD_HOSTNAME
      - DD_TAGS
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_CONTAINER_LABELS_AS_TAGS={"my.custom.label.team":"team"}
      - DD_APM_NON_LOCAL_TRAFFIC=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_SYSTEM_PROBE_NETWORK_ENABLED=true
    pid: "host"
    ports:
      - "8126:8126/tcp"
      - "8125:8125/udp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /sys/kernel/debug:/sys/kernel/debug
      - postgres_logs:/var/log/pg_log:ro
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
      - IPC_LOCK
      - CHOWN
    security_opt:
      - apparmor:unconfined
    networks:
      - storedog-network

  frontend:
    build:
      context: ./services/frontend
    command: bash -c "wait-for-it backend:4000 -- npm run build && npm run start"
    env_file: .env
    volumes:
      # featureFlags.config.json is the only file students/scripts change at lab runtime
      # (activity 5 swaps it from broken -> fixed). Everything else is baked into the image.
      - ./services/frontend/featureFlags.config.json:/app/featureFlags.config.json
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-production}
      - DD_SERVICE=store-frontend-api
      - DD_VERSION=${FRONTEND_VERSION:-1.0.0}
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - DD_PROFILING_TIMELINE_ENABLED=true
      - DD_PROFILING_ALLOCATION_ENABLED=true
      - NEXT_PUBLIC_DD_APPLICATION_ID=${DD_APPLICATION_ID:-DD_APPLICATION_ID-not-set}
      - NEXT_PUBLIC_DD_CLIENT_TOKEN=${DD_CLIENT_TOKEN:-DD_CLIENT_TOKEN-not-set}
      - NEXT_PUBLIC_DD_SITE=${DD_SITE:-datadoghq.com}
      - NEXT_PUBLIC_DD_SERVICE_FRONTEND=store-frontend
      - NEXT_PUBLIC_DD_ENV=${DD_ENV:-production}
      - NEXT_PUBLIC_DD_VERSION=${FRONTEND_VERSION:-1.0.0}
    depends_on:
      - dd-agent
      - backend
    labels:
      com.datadoghq.ad.logs: '[{"source": "nodejs", "service": "store-frontend"}]'
      com.datadoghq.tags.env: "${DD_ENV}"
      com.datadoghq.tags.service: "store-frontend"
      com.datadoghq.tags.version: "${FRONTEND_VERSION:-1.0.0}"
      my.custom.label.team: "frontend"
    networks:
      - storedog-network

  backend:
    build:
      context: ./services/backend
    command: wait-for-it postgres:5432 -- bundle exec rails s -b 0.0.0.0 -p 4000
    env_file: .env
    depends_on:
      - dd-agent
      - postgres
      - redis
    ports:
      - 4000:4000
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - RAILS_ENV=development
      - DD_AGENT_HOST=dd-agent
      - DD_ENV
      - DD_SERVICE=store-backend
      - DD_VERSION=1.5.0
      - DD_LOGS_INJECTION=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
    labels:
      com.datadoghq.ad.logs: '[{"source": "ruby", "service": "store-backend", "auto_multi_line_detection":true }]'
      com.datadoghq.tags.env: "${DD_ENV}"
      com.datadoghq.tags.service: "store-backend"
      com.datadoghq.tags.version: "1.5.0"
      my.custom.label.team: "backend"
    networks:
      - storedog-network

  worker:
    build:
      context: ./services/backend
    command: wait-for-it postgres:5432 -- bundle exec sidekiq -C config/sidekiq.yml
    env_file: .env
    depends_on:
      - dd-agent
      - postgres
      - redis
    environment:
      - REDIS_URL
      - DB_HOST=postgres
      - DB_PORT=5432
      - DD_AGENT_HOST=dd-agent
      - DD_ENV
      - DD_SERVICE=store-worker
      - DD_VERSION=1.5.0
      - DD_LOGS_INJECTION=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
    labels:
      com.datadoghq.ad.logs: '[{"source": "ruby", "service": "store-worker"}]'
      com.datadoghq.tags.env: "${DD_ENV}"
      com.datadoghq.tags.service: "store-worker"
      com.datadoghq.tags.version: "1.5.0"
      my.custom.label.team: "backend"
    networks:
      - storedog-network

  ads:
    build:
      context: ./services/ads/java
    env_file: .env
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_HOST=postgres
      - DD_AGENT_HOST=dd-agent
      - DD_ENV
      - DD_SERVICE=store-ads
      - DD_VERSION=1.5.0
      - DD_LOGS_INJECTION=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
    ports:
      - "${ADS_PORT:-9292}:3030"
    depends_on:
      - dd-agent
      - postgres
    labels:
      com.datadoghq.ad.logs: '[{"source": "java", "service": "store-ads"}]'
      com.datadoghq.tags.env: "${DD_ENV}"
      com.datadoghq.tags.service: "store-ads"
      com.datadoghq.tags.version: "1.5.0"
      my.custom.label.team: "advertisements"
    networks:
      - storedog-network

  discounts:
    build:
      context: ./services/discounts
    command: wait-for-it postgres:5432 -- ddtrace-run flask run --port=2814 --host=0.0.0.0
    env_file: .env
    environment:
      - POSTGRES_PASSWORD
      - POSTGRES_USER
      - POSTGRES_HOST=postgres
      - DD_AGENT_HOST=dd-agent
      - DD_ENV
      - DD_SERVICE=store-discounts
      - DD_VERSION=1.5.0
      - DD_LOGS_INJECTION=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - BROKEN_DISCOUNTS=${BROKEN_DISCOUNTS:-ENABLED}
    ports:
      - "${DISCOUNTS_PORT:-5001}:2814"
    depends_on:
      - dd-agent
      - postgres
    labels:
      com.datadoghq.ad.logs: '[{"source": "python", "service": "store-discounts"}]'
      com.datadoghq.tags.env: "${DD_ENV}"
      com.datadoghq.tags.service: "store-discounts"
      com.datadoghq.tags.version: "1.5.0"
      my.custom.label.team: "discounts"
    networks:
      - storedog-network

  postgres:
    build:
      context: ./services/postgres
    command: ["postgres", "-c", "config_file=/postgresql.conf"]
    env_file: .env
    restart: always
    volumes:
      - postgres_logs:/var/log/pg_log:rw
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DD_ENV=${DD_ENV:-dev}
      - DD_SERVICE=database
      - DD_VERSION=${DD_VERSION:-7}
      - DD_AGENT_HOST=dd-agent
      - DD_DBM_PROPAGATION_MODE=full
      - DD_LOGS_INJECTION=true
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
    depends_on:
      - dd-agent
    labels:
      com.datadoghq.tags.env: "${DD_ENV}"
      com.datadoghq.tags.service: "database"
      com.datadoghq.tags.version: "13"
      my.custom.label.team: "database"
      com.datadoghq.ad.check_names: '["postgres"]'
      com.datadoghq.ad.init_configs: "[{}]"
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port":5432, "username":"datadog", "password":"datadog"}]'
      com.datadoghq.ad.logs: '[{"source": "postgresql", "service": "database", "auto_multi_line_detection":true, "path": "/var/log/pg_log/postgresql*.json", "type": "file"}]'
    networks:
      - storedog-network

  redis:
    image: redis:6.2-alpine
    volumes:
      - redis:/data
    depends_on:
      - dd-agent
    labels:
      com.datadoghq.tags.env: "${DD_ENV}"
      com.datadoghq.tags.service: "redis"
      com.datadoghq.tags.version: "6.2"
      my.custom.label.team: "database"
      com.datadoghq.ad.check_names: '["redisdb"]'
      com.datadoghq.ad.init_configs: "[{}]"
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port":6379}]'
      com.datadoghq.ad.logs: '[{"source": "redis", "service": "redis"}]'
    networks:
      - storedog-network

  service-proxy:
    build:
      context: ./services/nginx
    restart: always
    ports:
      - "80:80"
    depends_on:
      - dd-agent
      - frontend
      - ads
      - discounts
      - backend
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-production}
      - DD_SERVICE=service-proxy
      - DD_VERSION=1.5.0
    labels:
      com.datadog.tags.env: "${DD_ENV}"
      com.datadog.tags.service: "service-proxy"
      com.datadog.tags.version: "1.27.1"
      com.datadoghq.ad.logs: '[{"source": "nginx", "service": "service-proxy"}]'
      com.datadoghq.ad.check_names: '["nginx"]'
      com.datadoghq.ad.init_configs: "[{}]"
      com.datadoghq.ad.instances: '[{"nginx_status_url": "http://%%host%%:81/nginx_status/"}]'
    networks:
      - storedog-network

  puppeteer:
    build:
      context: ./services/puppeteer
    platform: linux/amd64
    environment:
      - STOREDOG_URL=${STOREDOG_URL:-http://service-proxy:80}
      - PUPPETEER_TIMEOUT=${PUPPETEER_TIMEOUT:-30000}
    networks:
      - storedog-network
    depends_on:
      - frontend
    shm_size: '4gb' # Increase shared memory size
    cap_add:
      - 'SYS_ADMIN' # Required for Puppeteer to run in Docker

networks:
  storedog-network:
    driver: bridge

volumes:
  redis:
  postgres_logs:
