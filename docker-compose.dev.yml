# Storedog Development Environment
# This docker-compose file sets up a complete development environment for the Storedog application.
services:
  # Datadog Agent for monitoring and observability
  dd-agent:
    image: registry.datadoghq.com/agent:latest
    pid: host
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_ENV=${DD_ENV:-development}
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE=image:agent name:puppeteer
      - DD_CLOUD_PROVIDER_METADATA=[]
      - DD_HOSTNAME=${DD_HOSTNAME-development-host}
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_APM_MAX_TPS=1000
    networks:
      - storedog-network
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - postgres_logs:/var/log/pg_log:ro

  # Frontend service (Next.js)
  frontend:
    build:
      context: ./services/frontend
    command: bash -c "wait-for-it backend:4000 -- ${FRONTEND_COMMAND:-npm run dev}"
    depends_on:
      - worker
      - dd-agent
      - backend
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    networks:
      - storedog-network
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-frontend-api # used for Next.js API routes
      - DD_TRACE_SAMPLE_RATE=1
      - DD_VERSION=${NEXT_PUBLIC_DD_VERSION_FRONTEND-1.0.0}
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - DD_PROFILING_TIMELINE_ENABLED=true
      - DD_PROFILING_ALLOCATION_ENABLED=true
      - NEXT_PUBLIC_DD_APPLICATION_ID=${NEXT_PUBLIC_DD_APPLICATION_ID:-DD_APPLICATION_ID-not-set}
      - NEXT_PUBLIC_DD_CLIENT_TOKEN=${NEXT_PUBLIC_DD_CLIENT_TOKEN:-DD_CLIENT_TOKEN-not-set}
      - NEXT_PUBLIC_DD_SITE=${NEXT_PUBLIC_DD_SITE:-datadoghq.com}
      - NEXT_PUBLIC_DD_SERVICE_FRONTEND=store-frontend # used for client-side Next.js RUM configuration
      - NEXT_PUBLIC_DD_ENV=${DD_ENV:-development}
      - NEXT_PUBLIC_DD_VERSION_FRONTEND=${NEXT_PUBLIC_DD_VERSION_FRONTEND:-1.0.0}
      - NEXT_PUBLIC_ADS_ROUTE=${NEXT_PUBLIC_ADS_ROUTE:-/services/ads}
      - NEXT_PUBLIC_DISCOUNTS_ROUTE=${NEXT_PUBLIC_DISCOUNTS_ROUTE:-/services/discounts}
      - NEXT_PUBLIC_DBM_ROUTE=${NEXT_PUBLIC_DBM_ROUTE:-/services/dbm}
      - NEXT_PUBLIC_FRONTEND_API_ROUTE=${NEXT_PUBLIC_FRONTEND_API_ROUTE:-http://localhost:3000}
      - NEXT_PUBLIC_SPREE_API_HOST=${NEXT_PUBLIC_SPREE_API_HOST:-http://service-proxy/services/backend}
      - NEXT_PUBLIC_SPREE_CLIENT_HOST=${NEXT_PUBLIC_SPREE_CLIENT_HOST:-/services/backend}
      - NEXT_PUBLIC_SPREE_IMAGE_HOST=${NEXT_PUBLIC_SPREE_IMAGE_HOST:-/services/backend}
      - NEXT_PUBLIC_SPREE_ALLOWED_IMAGE_DOMAIN=${NEXT_PUBLIC_SPREE_ALLOWED_IMAGE_DOMAIN:-service-proxy}
    labels:
      com.datadoghq.ad.logs: '[{"source": "nodejs", "auto_multi_line_detection": true }]'

  # Backend service (Ruby on Rails/Spree)
  backend:
    build:
      context: ./services/backend
    command: bundle exec ddprofrb exec rails s -b 0.0.0.0 -p 4000 --pid /app/tmp/pids/server.pid
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      dd-agent:
        condition: service_started
      order-webhook-bridge:
        condition: service_healthy
      pricing:
        condition: service_started
    networks:
      - storedog-network
    volumes:
      - './services/backend:/app'
      - /app/public/assets
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD-postgres}
      - DISABLE_SPRING=1
      - RAILS_ENV=${RAILS_ENV:-production}
      - DB_POOL=${DB_POOL:-25}
      - MAX_THREADS=${MAX_THREADS:-5}
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-backend
      - DD_TRACE_SAMPLE_RATE=1
      - ORDER_WEBHOOK_ENABLED=${ORDER_WEBHOOK_ENABLED:-true}
      - ORDER_WEBHOOK_URL=${ORDER_WEBHOOK_URL:-http://order-webhook-bridge:8081}
      - PRICING_SERVICE_URL=${PRICING_SERVICE_URL:-http://pricing:5001}
      - DD_VERSION=${DD_VERSION_BACKEND:-1.0.0}
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - DD_PROFILING_ALLOCATION_ENABLED=true
      - DD_PROFILING_TIMELINE_ENABLED=true
    labels:
      com.datadoghq.ad.logs: '[{"source": "ruby", "auto_multi_line_detection": true }]'

  # Background job processor (Sidekiq)
  worker:
    build:
      context: ./services/backend
    command: bundle exec ddprofrb exec sidekiq -C config/sidekiq.yml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      backend:
        condition: service_started
      dd-agent:
        condition: service_started
      order-webhook-bridge:
        condition: service_healthy
      pricing:
        condition: service_started
    networks:
      - storedog-network
    volumes:
      - ./services/backend:/app
      - /app/public/assets
    environment:
      # this will never not be true
      - WORKER=true
      - REDIS_URL=redis://redis:6379/0
      - DB_HOST=postgres
      - DB_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DISABLE_SPRING=1
      - DB_POOL=${DB_POOL:-25}
      - MAX_THREADS=${MAX_THREADS:-5}
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-worker
      - DD_TRACE_SAMPLE_RATE=1
      - ORDER_WEBHOOK_ENABLED=${ORDER_WEBHOOK_ENABLED:-true}
      - ORDER_WEBHOOK_URL=${ORDER_WEBHOOK_URL:-http://order-webhook-bridge:8081}
      - PRICING_SERVICE_URL=${PRICING_SERVICE_URL:-http://pricing:5001}
      - DD_VERSION=${DD_VERSION_BACKEND:-1.0.0}
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - DD_PROFILING_TIMELINE_ENABLED=true
      - DD_PROFILING_ALLOCATION_ENABLED=true
    labels:
      com.datadoghq.ad.logs: '[{"source": "ruby", "auto_multi_line_detection": true }]'

  # Discounts service (Python/Flask)
  discounts:
    build:
      context: ./services/discounts
    command: ddtrace-run flask run --port=2814 --host=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      dd-agent:
        condition: service_started
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_HOST=postgres
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-discounts
      - DD_VERSION=${DD_VERSION_DISCOUNTS:-1.0.0}
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - DD_PROFILING_TIMELINE_ENABLED=true
      - DD_PROFILING_ALLOCATION_ENABLED=true
    volumes:
      - ./services/discounts:/app
    networks:
      - storedog-network
    labels:
      com.datadoghq.ad.logs: '[{"source": "python"}]'

  # Advertisement service (Java)
  ads:
    build:
      context: ./services/ads/java
    depends_on:
      postgres:
        condition: service_healthy
      dd-agent:
        condition: service_started
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_HOST=postgres
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-ads
      - DD_VERSION=${DD_VERSION_ADS:-1.0.0}
      - DD_PROFILING_ENABLED=true
      - DD_PROFILING_TIMELINE_ENABLED=true
      - DD_PROFILING_ALLOCATION_ENABLED=true
    networks:
      - storedog-network
    labels:
      com.datadoghq.ad.logs: '[{"source": "java"}]'

  # Advertisement service (Python)
  ads-python:
    build:
      context: ./services/ads/python
    command: wait-for-it postgres:5432 -- ddtrace-run flask run --port=3030 --host=0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
      dd-agent:
        condition: service_started
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_HOST=postgres
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-ads-python
      - DD_VERSION=${DD_VERSION_ADS_PYTHON:-1.0.0}
      - DD_RUNTIME_METRICS_ENABLED=true
      - DD_PROFILING_ENABLED=true
      - DD_PROFILING_TIMELINE_ENABLED=true
      - DD_PROFILING_ALLOCATION_ENABLED=true
    networks:
      - storedog-network
    labels:
      com.datadoghq.ad.logs: '[{"source": "python"}]'

  # Web server and reverse proxy
  service-proxy:
    build:
      context: ./services/nginx
    restart: always
    ports:
      - '80:80'
    networks:
      - storedog-network
    depends_on:
      - frontend
      - ads
      - ads-python
      - dd-agent
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=service-proxy
      - DD_TRACE_SAMPLE_RATE=1
      - DD_VERSION=${DD_VERSION_NGINX:-1.28.0}
      - ADS_A_UPSTREAM=${ADS_A_UPSTREAM:-ads:3030}
      - ADS_B_UPSTREAM=${ADS_B_UPSTREAM:-ads-python:3030}
      - ADS_B_PERCENT=${ADS_B_PERCENT:-50}
    labels:
      com.datadoghq.ad.logs: '[{"source": "nginx"}]'
      com.datadoghq.ad.check_names: '["nginx"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"nginx_status_url": "http://%%host%%:81/nginx_status/"}]'

  # Primary database
  postgres:
    build:
      context: ./services/postgres
    restart: always
    depends_on:
      - dd-agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_logs:/var/log/pg_log:rw
    networks:
      - storedog-network
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    labels:
      com.datadoghq.tags.service: 'store-db'
      com.datadoghq.tags.version: '${DD_VERSION_POSTGRES:-15.0}'
      com.datadoghq.ad.check_names: '["postgres"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port":5432, "username":"datadog", "password":"datadog"}]'
      com.datadoghq.ad.logs: '[{"source": "postgresql", "service":"store-db", "auto_multi_line_detection": true, "path": "/var/log/pg_log/postgresql*.json", "type": "file"}]'

  # Cache and job queue
  redis:
    image: redis:6.2-alpine
    depends_on:
      - dd-agent
    volumes:
      - 'redis:/data'
    networks:
      - storedog-network
    labels:
      com.datadoghq.tags.service: 'redis'
      com.datadoghq.tags.version: '${DD_VERSION_REDIS:-6.2}'
      com.datadoghq.ad.check_names: '["redisdb"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host":"%%host%%", "port":6379}]'
      com.datadoghq.ad.logs: '[{"source": "redis"}]'

  # Browser automation for testing
  puppeteer:
    build:
      context: ./services/puppeteer
    platform: linux/amd64
    environment:
      - STOREDOG_URL=${STOREDOG_URL:-http://service-proxy:80}
      - PUPPETEER_TIMEOUT=${PUPPETEER_TIMEOUT:-30000}
      - SKIP_SESSION_CLOSE=${SKIP_SESSION_CLOSE:-false}
    networks:
      - storedog-network
    volumes:
      - ./services/puppeteer/scripts/puppeteer.js:/home/pptruser/puppeteer.js
    depends_on:
      - frontend
    shm_size: '4gb' # Increase shared memory size
    cap_add:
      - 'SYS_ADMIN' # Required for Puppeteer to run in Docker

  # Kafka broker (KRaft mode) for the order pipeline
  kafka:
    image: confluentinc/cp-kafka:8.2.4
    hostname: kafka
    depends_on:
      - dd-agent
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - storedog-network
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      - KAFKA_JMX_PORT=9999
      - KAFKA_JMX_HOSTNAME=kafka
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
    labels:
      com.datadoghq.ad.check_names: '["kafka", "kafka_consumer"]'
      com.datadoghq.ad.init_configs: '[{},{}]'
      com.datadoghq.ad.instances: '[{"host": "%%host%%", "port": "9999"}, {"kafka_connect_str": "%%host%%:9092", "monitor_unlisted_consumer_groups": "true"}]'

  # Synthetic order generator (baseline pipeline traffic)
  order-producer:
    build:
      context: ./services/data-streams/kafka-producer
    depends_on:
      kafka:
        condition: service_healthy
      dd-agent:
        condition: service_started
    networks:
      - storedog-network
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-order-producer
      - DD_TRACE_SAMPLE_RATE=1
      - DD_SERVICE_NAME=store-order-producer
      - DD_VERSION=${DD_VERSION_PIPELINE:-1.0.0}
      - DD_DATA_STREAMS_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_SERVICE_MAPPING=kafka:store-order-producer
      - DD_TAGS=service_type:producer,pipeline_stage:order_creation
      - BOOTSTRAP=kafka:9092
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TOPICS_OUT=order-events
      - MESSAGES_PER_MINUTE=${PIPELINE_MESSAGES_PER_MINUTE:-60}
    labels:
      com.datadoghq.ad.logs: '[{"source": "java"}]'

  # Receives Storedog order webhooks and publishes them to Kafka
  order-webhook-bridge:
    build:
      context: ./services/data-streams/order-webhook-bridge
    depends_on:
      kafka:
        condition: service_healthy
      dd-agent:
        condition: service_started
    networks:
      - storedog-network
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-order-webhook-bridge
      - DD_SERVICE_NAME=store-order-webhook-bridge
      - DD_VERSION=${DD_VERSION_PIPELINE:-1.0.0}
      - DD_DATA_STREAMS_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_SERVICE_MAPPING=kafka:store-order-webhook-bridge
      - DD_TAGS=service_type:bridge,pipeline_stage:ingestion
      - SERVER_PORT=8081
      - BOOTSTRAP=kafka:9092
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - TOPICS_OUT=order-events
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200"]
      interval: 5s
      timeout: 5s
      retries: 20
    labels:
      com.datadoghq.ad.logs: '[{"source": "java"}]'

  order-validator:
    build:
      context: ./services/data-streams/kafka-consumer
    depends_on:
      kafka:
        condition: service_healthy
      dd-agent:
        condition: service_started
    networks:
      - storedog-network
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-order-validator
      - DD_SERVICE_NAME=store-order-validator
      - DD_VERSION=${DD_VERSION_PIPELINE:-1.0.0}
      - DD_DATA_STREAMS_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_SERVICE_MAPPING=kafka:store-order-validator
      - DD_TAGS=service_type:validation,pipeline_stage:order_validation
      - KAFKA_CONSUME_SERVER=kafka:9092
      - KAFKA_PRODUCE_SERVER=kafka:9092
      - TOPICS_IN=order-events
      - TOPICS_OUT=validated-orders,invalid-orders
      - CONSUMER_GROUP=order-validator-group
      - PROCESSING_TIME_MS_MIN=50
      - PROCESSING_TIME_MS_MAX=100
      - ERROR_RATE_PERCENT=0
      - VALIDATION_MODE=shipping-country
    labels:
      com.datadoghq.ad.logs: '[{"source": "java"}]'

  inventory-service:
    build:
      context: ./services/data-streams/kafka-consumer
    depends_on:
      kafka:
        condition: service_healthy
      dd-agent:
        condition: service_started
    networks:
      - storedog-network
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-inventory-service
      - DD_SERVICE_NAME=store-inventory-service
      - DD_VERSION=${DD_VERSION_PIPELINE:-1.0.0}
      - DD_DATA_STREAMS_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_SERVICE_MAPPING=kafka:store-inventory-service
      - DD_TAGS=service_type:inventory,pipeline_stage:inventory_reservation
      - KAFKA_CONSUME_SERVER=kafka:9092
      - KAFKA_PRODUCE_SERVER=kafka:9092
      - TOPICS_IN=validated-orders
      - TOPICS_OUT=inventory-reserved,inventory-unavailable
      - CONSUMER_GROUP=inventory-service-group
      - PROCESSING_TIME_MS_MIN=100
      - PROCESSING_TIME_MS_MAX=200
      - ERROR_RATE_PERCENT=0
    labels:
      com.datadoghq.ad.logs: '[{"source": "java"}]'

  payment-processor:
    build:
      context: ./services/data-streams/kafka-consumer
    depends_on:
      kafka:
        condition: service_healthy
      dd-agent:
        condition: service_started
    networks:
      - storedog-network
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-payment-processor
      - DD_SERVICE_NAME=store-payment-processor
      - DD_VERSION=${DD_VERSION_PIPELINE:-1.0.0}
      - DD_DATA_STREAMS_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_SERVICE_MAPPING=kafka:store-payment-processor
      - DD_TAGS=service_type:payment,pipeline_stage:payment_processing,pci_compliant:true
      - KAFKA_CONSUME_SERVER=kafka:9092
      - KAFKA_PRODUCE_SERVER=kafka:9092
      - TOPICS_IN=inventory-reserved
      - TOPICS_OUT=payment-confirmed,payment-failed
      - CONSUMER_GROUP=payment-processor-group
      - PROCESSING_TIME_MS_MIN=200
      - PROCESSING_TIME_MS_MAX=500
      - ERROR_RATE_PERCENT=0
      - VALIDATION_MODE=payment-amount
      - MAX_PAYMENT_AMOUNT_CENTS=30000
    labels:
      com.datadoghq.ad.logs: '[{"source": "java"}]'

  fraud-detector:
    build:
      context: ./services/data-streams/kafka-consumer
    depends_on:
      kafka:
        condition: service_healthy
      dd-agent:
        condition: service_started
    networks:
      - storedog-network
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-fraud-detector
      - DD_SERVICE_NAME=store-fraud-detector
      - DD_VERSION=${DD_VERSION_PIPELINE:-1.0.0}
      - DD_DATA_STREAMS_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_SERVICE_MAPPING=kafka:store-fraud-detector
      - DD_TAGS=service_type:security,pipeline_stage:fraud_detection,ml_enabled:true
      - KAFKA_CONSUME_SERVER=kafka:9092
      - KAFKA_PRODUCE_SERVER=kafka:9092
      - TOPICS_IN=order-events,payment-confirmed
      - TOPICS_OUT=fraud-alerts,order-events-analyzed
      - CONSUMER_GROUP=fraud-detector-group
      - PROCESSING_TIME_MS_MIN=50
      - PROCESSING_TIME_MS_MAX=150
      - ERROR_RATE_PERCENT=0
    labels:
      com.datadoghq.ad.logs: '[{"source": "java"}]'

  fulfillment-service:
    build:
      context: ./services/data-streams/kafka-consumer
    depends_on:
      kafka:
        condition: service_healthy
      dd-agent:
        condition: service_started
    networks:
      - storedog-network
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-fulfillment-service
      - DD_SERVICE_NAME=store-fulfillment-service
      - DD_VERSION=${DD_VERSION_PIPELINE:-1.0.0}
      - DD_DATA_STREAMS_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_SERVICE_MAPPING=kafka:store-fulfillment-service
      - DD_TAGS=service_type:fulfillment,pipeline_stage:order_fulfillment
      - KAFKA_CONSUME_SERVER=kafka:9092
      - KAFKA_PRODUCE_SERVER=kafka:9092
      - TOPICS_IN=payment-confirmed
      - TOPICS_OUT=order-fulfilled,shipment-created,warehouse-assigned
      - CONSUMER_GROUP=fulfillment-service-group
      - PROCESSING_TIME_MS_MIN=150
      - PROCESSING_TIME_MS_MAX=300
      - ERROR_RATE_PERCENT=0
    labels:
      com.datadoghq.ad.logs: '[{"source": "java"}]'

  notification-service:
    build:
      context: ./services/data-streams/kafka-consumer
    depends_on:
      kafka:
        condition: service_healthy
      dd-agent:
        condition: service_started
    networks:
      - storedog-network
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-notification-service
      - DD_SERVICE_NAME=store-notification-service
      - DD_VERSION=${DD_VERSION_PIPELINE:-1.0.0}
      - DD_DATA_STREAMS_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_SERVICE_MAPPING=kafka:store-notification-service
      - DD_TAGS=service_type:notification,pipeline_stage:customer_communication
      - KAFKA_CONSUME_SERVER=kafka:9092
      - TOPICS_IN=order-fulfilled,shipment-created,payment-failed,inventory-unavailable,fraud-alerts
      - CONSUMER_GROUP=notification-service-group
      - PROCESSING_TIME_MS_MIN=300
      - PROCESSING_TIME_MS_MAX=800
      - ERROR_RATE_PERCENT=0
    labels:
      com.datadoghq.ad.logs: '[{"source": "java"}]'

  analytics-aggregator:
    build:
      context: ./services/data-streams/kafka-consumer
    depends_on:
      kafka:
        condition: service_healthy
      dd-agent:
        condition: service_started
    networks:
      - storedog-network
    environment:
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-analytics-aggregator
      - DD_SERVICE_NAME=store-analytics-aggregator
      - DD_VERSION=${DD_VERSION_PIPELINE:-1.0.0}
      - DD_DATA_STREAMS_ENABLED=true
      - DD_LOGS_INJECTION=true
      - DD_SERVICE_MAPPING=kafka:store-analytics-aggregator
      - DD_TAGS=service_type:analytics,pipeline_stage:data_aggregation,consumer_only:true
      - KAFKA_CONSUME_SERVER=kafka:9092
      - TOPICS_IN=order-events,order-fulfilled,payment-confirmed,fraud-alerts
      - CONSUMER_GROUP=analytics-aggregator-group
      - PROCESSING_TIME_MS_MIN=500
      - PROCESSING_TIME_MS_MAX=1000
      - ERROR_RATE_PERCENT=0
      - KAFKA_CONSUMER_FETCH_MIN_BYTES=5120
      - KAFKA_CONSUMER_FETCH_MAX_WAIT_MS=5000
    labels:
      com.datadoghq.ad.logs: '[{"source": "java"}]'

  # Pricing microservice (bulk discount calculations used by the backend)
  pricing:
    build:
      context: ./services/pricing
    networks:
      - storedog-network
    environment:
      - PORT=5001
      - DD_AGENT_HOST=dd-agent
      - DD_ENV=${DD_ENV:-development}
      - DD_SERVICE=store-pricing
      - DD_VERSION=${DD_VERSION_PRICING:-1.0.0}
    labels:
      com.datadoghq.ad.logs: '[{"source": "go"}]'

volumes:
  kafka_data: # Kafka broker data
  redis: # Redis data persistence
  postgres_logs: # PostgreSQL logs storage

networks:
  storedog-network: # Main application network
